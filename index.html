<style>
:root {
  --bg:#0a0e17; --card:#111827; --card2:#1a2332; --border:#1e293b;
  --text:#e2e8f0; --muted:#64748b; --accent:#38bdf8;

* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh;
}
header {
  position:sticky; top:0; z-index:100;
  background:rgba(10,14,23,.95); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.header-left { display:flex; align-items:center; gap:12px; }
h1 { font-size:18px; font-weight:700; }
.tabs { display:flex; gap:4px; margin:16px 0; flex-wrap:wrap; }
.tab {
  padding:8px 18px; border:1px solid var(--border); border-radius:8px;
  background:var(--card); color:var(--muted); cursor:pointer; font-size:14px; font-weight:600;
  transition:all .15s;
}
.tab.active { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.tab:hover { opacity:.85; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.container { max-width:1200px; margin:0 auto; padding:20px; }
.activity-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; margin-bottom:16px;
}
.activity-header {
  display:flex; justify-content:space-between; align-items:start; flex-wrap:wrap; gap:8px; margin-bottom:12px;
}
.activity-title { font-size:18px; font-weight:700; }
.activity-id {
  font-size:12px; padding:3px 10px; border-radius:10px; font-weight:600;
  background:rgba(56,189,248,.15); color:var(--accent);
}
.activity-type {
  font-size:11px; padding:2px 8px; border-radius:8px; font-weight:600;
}
.type-team { background:rgba(168,85,247,.15); color:var(--purple); }
.type-interest { background:rgba(34,197,94,.15); color:var(--green); }
.type-support { background:rgba(234,179,8,.15); color:var(--yellow); }
.type-care { background:rgba(100,116,139,.15); color:var(--muted); }
.type-other { background:rgba(251,146,60,.15); color:var(--orange); }
.info-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; margin-bottom:12px;
}
.info-item {
  background:var(--card2); border-radius:6px; padding:8px 12px;
}
.info-label { font-size:11px; color:var(--muted); }
.info-value { font-size:14px; font-weight:600; margin-top:2px; }
.dates-box {
  background:var(--card2); border-radius:6px; padding:10px 14px; margin-bottom:12px;
  font-size:13px; color:var(--muted); line-height:1.8;
}
.dates-label { font-size:11px; color:var(--accent); font-weight:600; margin-bottom:4px; }
.student-count {
  display:inline-block; padding:3px 12px; border-radius:12px;
  font-size:13px; font-weight:600; margin-bottom:8px;
}
.count-has { background:rgba(34,197,94,.15); color:var(--green); }
.count-zero { background:rgba(239,68,68,.12); color:var(--red); }
.student-table { width:100%; border-collapse:collapse; font-size:13px; }
.student-table th {
  background:var(--bg); color:var(--muted); font-size:11px; padding:6px 10px; text-align:left;
  text-transform:uppercase; letter-spacing:0.5px;
}
.student-table td { padding:6px 10px; border-top:1px solid var(--border); }
.student-table tr:hover { background:rgba(56,189,248,.03); }
.note { font-size:12px; color:var(--muted); padding:8px; background:rgba(234,179,8,.08); border-radius:6px; border-left:3px solid var(--yellow); margin-top:8px; }
.footer { text-align:center; padding:16px; color:var(--muted); font-size:12px; }
@media print {
  header, .tabs { display:none; }
  .tab-content { display:block !important; }
  body { background:#fff; color:#000; }
  .activity-card { border:1px solid #ccc; break-inside:avoid; }
}
@media (max-width:640px) { .info-grid { grid-template-columns:1fr; } }
</style>
</head>

var dayMap = { mon:'星期一', tue:'星期二', wed:'星期三', thu:'星期四', fri:'星期五', sat:'星期六' };

function switchDayTab(el, day) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderDay(day);
}

function typeClass(type) {
  if (type.indexOf('\u968a') >= 0 || type.indexOf('\u6821\u968a') >= 0) return 'type-team';
  if (type.indexOf('\u8208\u8da3') >= 0) return 'type-interest';
  if (type.indexOf('\u652f\u63f4') >= 0) return 'type-support';
  if (type.indexOf('\u8a17\u7ba1') >= 0) return 'type-care';
  return 'type-other';
}

function renderDay(day) {
  var dayName = dayMap[day];
  var groups = EMBEDDED_DATA.groups.filter(function(g) { return g.day.indexOf(dayName) >= 0; });
  var html = '';
  if (groups.length === 0) {
    html = '<p style="color:var(--muted);padding:40px;text-align:center;">\u6b64\u65e5\u7121\u6d3b\u52d5\u5b89\u6392</p>';
  } else {
    html = '<p style="color:var(--muted);margin-bottom:16px;">\u5171 ' + groups.length + ' \u500b\u6d3b\u52d5\u5c0f\u7d44</p>';
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      var tc = typeClass(g.type);
      var cc = g.student_count > 0 ? 'count-has' : 'count-zero';
      var studentTable = '';
      if (EMBEDDED_DATA.all_students && EMBEDDED_DATA.all_students[g.id]) {
        studentTable = renderStudentTable(EMBEDDED_DATA.all_students[g.id]);
      } else if (g.student_count > 0) {
        studentTable = '<div class="note">\ud83d\udcdd \u5b78\u751f\u540d\u55ae\u5171 ' + g.student_count + ' \u4eba \u2014 \u8a73\u7d30\u540d\u55ae\u8acb\u767b\u5165\u7cfb\u7d71\u67e5\u770b</div>';
      } else {
        studentTable = '<div class="note">\u26a0\ufe0f \u6b64\u5c0f\u7d44\u5c1a\u672a\u52a0\u5165\u5b78\u751f</div>';
      }
      var dateParts = g.dates ? g.dates.split(/[,\uff0c\u3001\s]+/).filter(function(x){return x.length>0}) : [];
      var dateCount = dateParts.length;
      html += '<div class="activity-card">' +
        '<div class="activity-header"><div>' +
        '<span class="activity-id">' + g.id + '</span> ' +
        '<span class="activity-type ' + tc + '">' + g.type + '</span>' +
        '<div class="activity-title" style="margin-top:6px;">' + g.name + '</div>' +
        '</div><span class="student-count ' + cc + '">' + g.student_count + ' \u4eba</span></div>' +
        '<div class="info-grid">' +
        '<div class="info-item"><div class="info-label">\ud83d\udcc5 \u4e0a\u8ab2\u65e5</div><div class="info-value">' + g.day + '</div></div>' +
        '<div class="info-item"><div class="info-label">\u23f0 \u6642\u9593</div><div class="info-value">' + g.time + '</div></div>' +
        '<div class="info-item"><div class="info-label">\ud83d\udccd \u5730\u9ede</div><div class="info-value">' + g.venue + '</div></div>' +
        '<div class="info-item"><div class="info-label">\ud83d\udc64 \u8ca0\u8cac\u8001\u5e2b</div><div class="info-value">' + g.teacher + '</div></div>' +
        '</div>' +
        '<div class="dates-box"><div class="dates-label">\ud83d\udcc5 \u6d3b\u52d5\u65e5\u671f\uff08\u5171 ' + dateCount + ' \u5802\uff09</div>' + (g.dates || '\u672a\u8a2d\u5b9a') + '</div>' +
        studentTable +
        '</div>';
    }
  }
  document.getElementById('content').innerHTML = html;
}

function renderStudentTable(students) {
  if (!students || students.length === 0) return '<div class="note">\u7121\u5b78\u751f\u540d\u55ae</div>';
  var rows = '';
  for (var i = 0; i < students.length; i++) {
    var s = students[i];
    rows += '<tr><td>' + s.no + '</td><td>' + s.class + '</td><td>' + s.id + '</td><td style="font-weight:600">' + s.name + '</td><td>' + (s.gender === 'M' ? '\u7537' : '\u5973') + '</td></tr>';
  }
  return '<div style="margin-top:12px;"><table class="student-table"><thead><tr><th>#</th><th>\u73ed\u5225</th><th>\u5b78\u865f</th><th>\u5b78\u751f\u59d3\u540d</th><th>\u6027\u5225</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}
