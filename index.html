<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日蝕模擬器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e1a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #1a1f2e, #0d1220);
            border-radius: 20px; padding: 30px;
            max-width: 700px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3050;
        }
        h1 {
            text-align: center; color: #f0e6d0;
            font-size: 1.6em; margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center; color: #8899bb;
            font-size: 0.85em; margin-bottom: 20px;
        }
        canvas {
            display: block; width: 100%;
            border-radius: 12px;
            background: #000;
            cursor: grab; touch-action: none;
        }
        canvas:active { cursor: grabbing; }
        .controls {
            margin-top: 18px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .control-row {
            display: flex; align-items: center; gap: 14px;
            flex-wrap: wrap; justify-content: center;
        }
        .control-row label {
            color: #b0c0dd; font-size: 0.85em; white-space: nowrap;
        }
        input[type="range"] {
            flex: 1; min-width: 120px;
            -webkit-appearance: none; height: 4px;
            background: linear-gradient(90deg, #2a3050, #ffaa44);
            border-radius: 2px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            background: radial-gradient(#ffcc66, #dd8800);
            border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 12px #ff880088;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px;
            background: radial-gradient(#ffcc66, #dd8800);
            border-radius: 50%; cursor: pointer; border: none;
        }
        .btn {
            background: linear-gradient(145deg, #2a3050, #1a1f35);
            color: #c0d0ee; border: 1px solid #3a4060;
            padding: 8px 18px; border-radius: 8px;
            cursor: pointer; font-size: 0.85em;
            transition: all 0.2s;
        }
        .btn:hover { background: linear-gradient(145deg, #3a4060, #2a3050); color: #fff; }
        .btn.active { background: linear-gradient(145deg, #c87700, #a05500); border-color: #ffaa44; color: #fff; }
        .stats {
            display: flex; justify-content: space-around;
            color: #b0c0dd; font-size: 0.85em; text-align: center;
            flex-wrap: wrap; gap: 8px;
        }
        .stats span { display: flex; flex-direction: column; }
        .stats .val { color: #f0e6d0; font-size: 1.2em; font-weight: bold; }
        .stats .val.full { color: #ff8844; }
        .stats .val.total { color: #ffcc44; text-shadow: 0 0 20px #ff880088; }
        .phase-label {
            text-align: center; font-size: 1.1em; font-weight: bold;
            color: #ffcc66; margin-top: 8px;
            min-height: 1.6em;
        }
        .speed-control {
            display: flex; align-items: center; gap: 8px;
        }
        .speed-control span {
            color: #8899bb; font-size: 0.75em; cursor: pointer;
            padding: 2px 8px; border-radius: 4px;
            transition: all 0.2s;
        }
        .speed-control span:hover { color: #fff; background: #2a305055; }
        .speed-control span.active { color: #ffcc66; background: #2a305088; }
        @media (max-width: 500px) {
            .container { padding: 15px; }
            h1 { font-size: 1.2em; }
            .stats { font-size: 0.75em; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>☀️ 日蝕模擬器</h1>
    <div class="subtitle">拖曳月球 · 觀察日蝕全過程</div>
    <canvas id="c" width="640" height="480"></canvas>

    <div class="phase-label" id="phaseLabel">🌞 正常日照</div>

    <div class="controls">
        <div class="control-row">
            <label>🌙 位置</label>
            <input type="range" id="posSlider" min="0" max="100" value="100">
        </div>
        <div class="control-row">
            <button class="btn active" id="playBtn">▶ 播放</button>
            <button class="btn" id="resetBtn">↺ 重置</button>
            <div class="speed-control">
                <span data-speed="0.3">0.3×</span>
                <span data-speed="0.5">0.5×</span>
                <span data-speed="1" class="active">1×</span>
                <span data-speed="2">2×</span>
                <span data-speed="4">4×</span>
            </div>
        </div>
        <div class="stats">
            <span>覆蓋率 <span class="val" id="coverageVal">0.0%</span></span>
            <span>亮度 <span class="val" id="brightnessVal">100%</span></span>
            <span>食分 <span class="val" id="magnitudeVal">0.00</span></span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const posSlider = document.getElementById('posSlider');
    const phaseLabel = document.getElementById('phaseLabel');
    const coverageVal = document.getElementById('coverageVal');
    const brightnessVal = document.getElementById('brightnessVal');
    const magnitudeVal = document.getElementById('magnitudeVal');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const speedSpans = document.querySelectorAll('.speed-control span');

    const W = 640, H = 480;
    const cx = W / 2, cy = H / 2 + 10;
    const sunR = 100;
    const moonR = 96;

    let t = 1.0;
    let playing = true;
    let speed = 1;
    let dragging = false;

    function circleIntersectionArea(d, r1, r2) {
        if (d >= r1 + r2) return 0;
        if (d <= Math.abs(r1 - r2)) {
            const small = Math.min(r1, r2);
            return Math.PI * small * small;
        }
        const p1 = Math.acos((d*d + r1*r1 - r2*r2) / (2*d*r1));
        const p2 = Math.acos((d*d + r2*r2 - r1*r1) / (2*d*r2));
        const part1 = r1*r1 * p1;
        const part2 = r2*r2 * p2;
        const part3 = 0.5 * Math.sqrt(
            (-d+r1+r2) * (d+r1-r2) * (d-r1+r2) * (d+r1+r2)
        );
        return part1 + part2 - part3;
    }

    function getMoonX(t) {
        const startX = W + 60;
        const endX = -60;
        return startX + (endX - startX) * t;
    }

    function drawScene() {
        const mx = getMoonX(t);
        const my = cy + 6;
        const d = Math.hypot(mx - cx, my - cy);
        const overlap = circleIntersectionArea(d, sunR, moonR);
        const coverage = Math.min(overlap / (Math.PI * sunR * sunR), 1);
        const brightness = 1 - coverage * 0.92;
        const magnitude = (d < sunR + moonR) ? (sunR + moonR - d) / (2 * sunR) : 0;

        // Sky darkening
        const skyBase = [25, 60, 130];
        const skyDark = [5, 8, 20];
        const skyCorona = [10, 5, 30];
        let skyR, skyG, skyB;
        if (coverage > 0.95) {
            const p = (coverage - 0.95) / 0.05;
            skyR = skyDark[0] + (skyCorona[0] - skyDark[0]) * p;
            skyG = skyDark[1] + (skyCorona[1] - skyDark[1]) * p;
            skyB = skyDark[2] + (skyCorona[2] - skyDark[2]) * p;
        } else {
            const p = coverage / 0.95;
            skyR = skyBase[0] + (skyDark[0] - skyBase[0]) * p;
            skyG = skyBase[1] + (skyDark[1] - skyBase[1]) * p;
            skyB = skyBase[2] + (skyDark[2] - skyBase[2]) * p;
        }

        ctx.fillStyle = `rgb(${skyR|0},${skyG|0},${skyB|0})`;
        ctx.fillRect(0, 0, W, H);

        // Stars
        const starAlpha = Math.min(Math.max((1 - brightness - 0.3) * 3, 0), 1);
        if (starAlpha > 0.02) {
            if (!drawScene._stars) {
                drawScene._stars = [];
                for (let i = 0; i < 300; i++) {
                    drawScene._stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H * 0.6 + 10,
                        r: Math.random() * 1.8 + 0.3,
                        a: Math.random() * 0.7 + 0.3
                    });
                }
            }
            drawScene._stars.forEach(s => {
                const flicker = 0.7 + 0.3 * Math.sin(Date.now() * 0.001 + s.x);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.a * starAlpha * flicker})`;
                ctx.fill();
            });
        }

        // Sun glow
        const glowR = sunR * (1 + 0.3 * (1 - coverage));
        const grad = ctx.createRadialGradient(cx, cy, sunR * 0.1, cx, cy, glowR);
        if (coverage > 0.85) {
            const corona = (coverage - 0.85) / 0.15;
            grad.addColorStop(0, `rgba(255,220,150,${0.3 * (1-corona)})`);
            grad.addColorStop(0.4, `rgba(255,200,100,${0.15 * (1-corona)})`);
            grad.addColorStop(1, `rgba(255,180,80,0)`);
        } else {
            grad.addColorStop(0, 'rgba(255,220,150,0.3)');
            grad.addColorStop(0.4, 'rgba(255,200,100,0.15)');
            grad.addColorStop(1, 'rgba(255,180,80,0)');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(cx - glowR, cy - glowR, glowR * 2, glowR * 2);

        // Sun
        const sg = ctx.createRadialGradient(cx - 15, cy - 15, 5, cx, cy, sunR);
        sg.addColorStop(0, '#fff8e8');
        sg.addColorStop(0.15, '#ffee88');
        sg.addColorStop(0.5, '#ffcc33');
        sg.addColorStop(0.85, '#ee9900');
        sg.addColorStop(1, '#cc7700');
        ctx.beginPath();
        ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
        ctx.fillStyle = sg;
        ctx.fill();

        // Moon
        const mg = ctx.createRadialGradient(mx - 12, my - 12, 8, mx, my, moonR);
        mg.addColorStop(0, '#888899');
        mg.addColorStop(0.3, '#555566');
        mg.addColorStop(0.7, '#333344');
        mg.addColorStop(1, '#1a1a22');
        ctx.beginPath();
        ctx.arc(mx, my, moonR, 0, Math.PI * 2);
        ctx.fillStyle = mg;
        ctx.fill();

        // Moon shadow/terminator effect - subtle inner shadow
        const termGrad = ctx.createRadialGradient(
            mx + 20, my - 15, moonR * 0.1,
            mx, my, moonR
        );
        termGrad.addColorStop(0, 'rgba(0,0,0,0)');
        termGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
        termGrad.addColorStop(0.85, 'rgba(0,0,0,0.15)');
        termGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.beginPath();
        ctx.arc(mx, my, moonR, 0, Math.PI * 2);
        ctx.fillStyle = termGrad;
        ctx.fill();

        // Corona during totality
        if (coverage > 0.92) {
            const coronaIntensity = (coverage - 0.92) / 0.08;
            for (let ring = 0; ring < 5; ring++) {
                const r = sunR * (1.05 + ring * 0.15);
                const alpha = coronaIntensity * (0.08 - ring * 0.012);
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,220,180,${Math.max(alpha,0)})`;
                ctx.lineWidth = 2 + ring * 1.5;
                ctx.stroke();
            }

            // Corona rays
            const rays = 16;
            for (let i = 0; i < rays; i++) {
                const angle = (i / rays) * Math.PI * 2 + Date.now() * 0.0003;
                const len = sunR * (1.2 + 0.6 * Math.sin(i * 2.7));
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * sunR * 0.98, cy + Math.sin(angle) * sunR * 0.98);
                ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
                ctx.strokeStyle = `rgba(255,220,190,${coronaIntensity * 0.1})`;
                ctx.lineWidth = 1.5 + Math.sin(i * 3.1) * 0.8;
                ctx.stroke();
            }

            // Diamond ring effect near edges of totality
            if (coverage > 0.92 && coverage < 0.99) {
                const diamondAlpha = Math.sin((coverage - 0.92) / 0.07 * Math.PI) * 0.8;
                const angle = Math.atan2(my - cy, mx - cx);
                const dx = Math.cos(angle + Math.PI) * sunR * 0.92;
                const dy = Math.sin(angle + Math.PI) * sunR * 0.92;
                const dg = ctx.createRadialGradient(
                    cx + dx, cy + dy, 2,
                    cx + dx, cy + dy, 30
                );
                dg.addColorStop(0, `rgba(255,255,255,${diamondAlpha})`);
                dg.addColorStop(0.3, `rgba(255,240,200,${diamondAlpha * 0.5})`);
                dg.addColorStop(1, 'rgba(255,220,150,0)');
                ctx.fillStyle = dg;
                ctx.fillRect(cx + dx - 30, cy + dy - 30, 60, 60);
            }
        }

        // Horizon glow
        const hg = ctx.createLinearGradient(0, H - 60, 0, H);
        hg.addColorStop(0, 'rgba(255,200,100,0)');
        hg.addColorStop(0.5, `rgba(255,180,80,${0.08 * (1 - coverage)})`);
        hg.addColorStop(1, `rgba(255,160,60,${0.15 * (1 - coverage)})`);
        ctx.fillStyle = hg;
        ctx.fillRect(0, H - 60, W, 60);

        // Update UI
        coverageVal.textContent = (coverage * 100).toFixed(1) + '%';
        brightnessVal.textContent = (brightness * 100).toFixed(0) + '%';
        magnitudeVal.textContent = Math.max(0, magnitude).toFixed(2);

        if (coverage > 0.99) {
            phaseLabel.textContent = '🌑 食甚 · 日全蝕';
            phaseLabel.style.color = '#ff8844';
        } else if (coverage > 0.92) {
            phaseLabel.textContent = '🌘 接近食甚 · 貝利珠出現';
            phaseLabel.style.color = '#ffaa55';
        } else if (coverage > 0.3) {
            phaseLabel.textContent = '🌗 食甚 · 偏蝕階段';
            phaseLabel.style.color = '#ffcc66';
        } else if (coverage > 0.02) {
            phaseLabel.textContent = '🌖 初虧 · 月球開始遮擋';
            phaseLabel.style.color = '#ddcc88';
        } else {
            phaseLabel.textContent = '☀️ 正常日照';
            phaseLabel.style.color = '#ffcc66';
        }

        posSlider.value = t * 100;
    }

    function animate() {
        if (playing) {
            t += 0.003 * speed;
            if (t > 1.1) {
                t = -0.1;
            }
        }
        drawScene();
        requestAnimationFrame(animate);
    }

    // Slider
    posSlider.addEventListener('input', () => {
        t = parseFloat(posSlider.value) / 100;
        playing = false;
        playBtn.textContent = '▶ 播放';
        playBtn.classList.remove('active');
    });

    // Play/Pause
    playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? '▶ 播放' : '⏸ 暫停';
        playBtn.classList.toggle('active');
    });

    // Reset
    resetBtn.addEventListener('click', () => {
        t = 1.0;
        playing = true;
        playBtn.textContent = '▶ 播放';
        playBtn.classList.add('active');
        posSlider.value = t * 100;
    });

    // Speed
    speedSpans.forEach(s => {
        s.addEventListener('click', () => {
            speedSpans.forEach(x => x.classList.remove('active'));
            s.classList.add('active');
            speed = parseFloat(s.dataset.speed);
        });
    });

    // Drag on canvas
    function handleDrag(e) {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const canvasX = (clientX - rect.left) * scaleX;
        t = Math.max(0, Math.min(1, (W + 60 - canvasX) / (W + 120)));
        playing = false;
        playBtn.textContent = '▶ 播放';
        playBtn.classList.remove('active');
        posSlider.value = t * 100;
    }

    canvas.addEventListener('mousedown', (e) => {
        dragging = true;
        handleDrag(e);
    });
    canvas.addEventListener('mousemove', (e) => {
        if (dragging) handleDrag(e);
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    canvas.addEventListener('touchstart', (e) => {
        dragging = true;
        handleDrag(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        if (dragging) handleDrag(e);
    }, { passive: false });
    canvas.addEventListener('touchend', () => { dragging = false; });

    // Start
    animate();
</script>
</body>
</html>
